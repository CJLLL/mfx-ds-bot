name: Release plugin

# Configure npm Trusted Publishing for mfx-ds-bot, CJLLL/mfx-ds-bot,
# workflow release.yml before publishing a new version through Actions.
# This fork publishes the plugin only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and pack without publishing
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'CJLLL/mfx-ds-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check release target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag must be v$version"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --no-fund --no-audit
      - run: npm run harness
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint
      - name: Pack
        run: npm pack --json > pack-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: mfx-ds-bot-package
          path: ds-bot/mfx-ds-bot-*.tgz
          if-no-files-found: error
      - name: Publish or verify existing release
        if: github.event_name == 'release' || (!inputs.dry_run && github.ref == 'refs/heads/main')
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const [packed] = JSON.parse(readFileSync('pack-result.json', 'utf8'))
          const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`)
          if (response.ok) {
            const published = await response.json()
            if (published.dist?.integrity !== packed.integrity) throw new Error('Published version has different contents; bump the version')
            console.log('This exact package is already published')
          } else {
            if (response.status !== 404) throw new Error(`npm registry returned ${response.status}`)
            execFileSync('npm', ['publish', packed.filename, '--provenance', '--access', 'public', '--tag', pkg.version.includes('-') ? 'next' : 'latest'], { stdio: 'inherit' })
          }
          NODE
      - name: Attach verified package
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          filename="$(node -p "require('./pack-result.json')[0].filename")"
          gh release upload "$TAG" "$filename" --clobber
